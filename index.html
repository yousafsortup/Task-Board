<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Task Board</title>
    <style>
      /*
       * The only hand-written CSS in the project. React Native Web needs the
       * document to be a full-height flex container; everything else is styled
       * by the shared design system.
       */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        background-color: #f4f5f7;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0b0c10;
        }
      }

      #root {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>
